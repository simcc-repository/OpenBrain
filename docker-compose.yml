# Open Brain - Docker Compose for Local Development
# Usage: docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: openbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openbrain
      POSTGRES_USER: openbrain
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openbrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: openbrain-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-openbrain}
      DB_USER: ${DB_USER:-openbrain}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      EMBEDDER_PROVIDER: ${EMBEDDER_PROVIDER:-ollama}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://localhost:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBED_MODEL: ${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_LLM_MODEL: ${OPENROUTER_LLM_MODEL:-openai/gpt-4o-mini}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_EMBED_DEPLOYMENT: ${AZURE_OPENAI_EMBED_DEPLOYMENT:-}
      AZURE_OPENAI_LLM_DEPLOYMENT: ${AZURE_OPENAI_LLM_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      API_PORT: ${API_PORT:-8000}
      MCP_PORT: ${MCP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"   # REST API
      - "${MCP_PORT:-8080}:${MCP_PORT:-8080}"   # MCP Server
    networks:
      - default
      - litellm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

networks:
  litellm:
    name: litellm-langfuse_default
    external: true
